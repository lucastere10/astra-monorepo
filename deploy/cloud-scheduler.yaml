# Cloud Scheduler jobs that trigger Cloud Run Jobs via the Jobs API.
# Placeholders:
#   __REGION__  __PROJECT_ID__  __JOB_COLLECT__  __JOB_DELIVER__
#   __COLLECT_CRON__  __DELIVER_CRON__  __SCHEDULER_SA__
#
# Applied by cloudbuild.yaml with `gcloud scheduler jobs update/create http`.
# The Jobs Admin API (*.run.googleapis.com) expects an OAuth access token,
# not an OIDC ID token.

# --- Collect (every 4 hours by default) ---
# name: astra-collect-schedule
# schedule: __COLLECT_CRON__
# timeZone: UTC
# httpTarget:
#   uri: https://__REGION__-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/__PROJECT_ID__/jobs/__JOB_COLLECT__:run
#   httpMethod: POST
#   oauthToken:
#     serviceAccountEmail: __SCHEDULER_SA__
#     scope: https://www.googleapis.com/auth/cloud-platform

# --- Deliver (3 min before morning / midday / evening, America/Sao_Paulo) ---
# name: astra-deliver-schedule
# schedule: __DELIVER_CRON__
# timeZone: America/Sao_Paulo
# httpTarget:
#   uri: https://__REGION__-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/__PROJECT_ID__/jobs/__JOB_DELIVER__:run
#   httpMethod: POST
#   oauthToken:
#     serviceAccountEmail: __SCHEDULER_SA__
#     scope: https://www.googleapis.com/auth/cloud-platform

apiVersion: v1
kind: List
items:
  - apiVersion: cloudscheduler.googleapis.com/v1
    kind: Job
    metadata:
      name: projects/__PROJECT_ID__/locations/__REGION__/jobs/astra-collect-schedule
    spec:
      description: Run Astra collector ingest every few hours
      schedule: __COLLECT_CRON__
      timeZone: UTC
      httpTarget:
        uri: https://__REGION__-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/__PROJECT_ID__/jobs/__JOB_COLLECT__:run
        httpMethod: POST
        oauthToken:
          serviceAccountEmail: __SCHEDULER_SA__
          scope: https://www.googleapis.com/auth/cloud-platform
      retryConfig:
        retryCount: 1
  - apiVersion: cloudscheduler.googleapis.com/v1
    kind: Job
    metadata:
      name: projects/__PROJECT_ID__/locations/__REGION__/jobs/astra-deliver-schedule
    spec:
      description: Run Astra newsletter deliver 3 min before morning, midday, and evening
      schedule: __DELIVER_CRON__
      timeZone: America/Sao_Paulo
      httpTarget:
        uri: https://__REGION__-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/__PROJECT_ID__/jobs/__JOB_DELIVER__:run
        httpMethod: POST
        oauthToken:
          serviceAccountEmail: __SCHEDULER_SA__
          scope: https://www.googleapis.com/auth/cloud-platform
      retryConfig:
        retryCount: 1
