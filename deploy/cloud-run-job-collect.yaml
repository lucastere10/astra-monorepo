# Cloud Run Job — collector collect
# Placeholders: __JOB_NAME__  __IMAGE__  __REGION__  __APP_URL__  __EMAIL_FROM__
#               __OPENAI_MODEL__  __OPENAI_EMBEDDING_MODEL__  __SERVICE_ACCOUNT__
#
# Applied by cloudbuild.yaml via `gcloud run jobs deploy`. Override command is
# already the image default; args force `collect` explicitly.

apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: __JOB_NAME__
  labels:
    cloud.googleapis.com/location: __REGION__
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
    spec:
      taskCount: 1
      parallelism: 1
      template:
        spec:
          maxRetries: 1
          timeoutSeconds: "3600"
          serviceAccountName: __SERVICE_ACCOUNT__
          containers:
            - image: __IMAGE__
              command:
                - collector
              args:
                - collect
              resources:
                limits:
                  cpu: "2"
                  memory: 2Gi
              env:
                - name: APP_URL
                  value: __APP_URL__
                - name: EMAIL_FROM
                  value: __EMAIL_FROM__
                - name: OPENAI_MODEL
                  value: __OPENAI_MODEL__
                - name: OPENAI_EMBEDDING_MODEL
                  value: __OPENAI_EMBEDDING_MODEL__
                - name: MAX_ARTICLES_PER_SOURCE
                  value: "15"
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: astra-database-url
                      key: latest
                - name: OPENAI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: astra-openai-api-key
                      key: latest
                - name: EXA_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: astra-exa-api-key
                      key: latest
                - name: RESEND_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: astra-resend-api-key
                      key: latest
